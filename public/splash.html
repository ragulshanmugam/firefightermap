<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <title>FirefighterMap — Live modqueue intelligence</title>
    <link rel="stylesheet" href="splash.css" />
  </head>
  <body>
    <nav class="globalnav" aria-label="Global">
      <span class="brand-mark">
        <span class="mark-glyph" aria-hidden="true"></span>
        FirefighterMap
      </span>
      <span class="nav-spacer"></span>
      <span class="live-indicator" id="liveIndicator" aria-live="polite">
        <span class="live-dot" aria-hidden="true"></span>
        <span class="live-label">Live</span>
      </span>
    </nav>

    <header class="subnav" aria-label="Page">
      <h1>Live modqueue intelligence</h1>
      <span class="spacer"></span>
      <div class="meta-pills" id="metaPills"></div>
      <button class="refresh-btn" id="refreshBtn" type="button" aria-label="Refresh now">
        <svg class="refresh-icon" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.5 2v3.5h-3.5M2.5 14v-3.5h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2.5 7.5a5.5 5.5 0 0 1 9.9-2M13.5 8.5a5.5 5.5 0 0 1-9.9 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <span>Refresh</span>
      </button>
    </header>

    <section class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <h2 id="heroTitle">All quiet.</h2>
          <p class="lead" id="heroLead">Surfacing brigades, raids, and near-duplicate spam waves the moment they form.</p>
        </div>

        <div class="hero-viz">
          <div class="chart-card">
            <div class="chart-card-head">
              <span class="chart-card-label">Sub activity · last 60 min</span>
              <span class="chart-card-meta" id="activityTotal">0 events</span>
            </div>
            <svg class="activity-chart" id="activityChart" viewBox="0 0 360 96" preserveAspectRatio="none" aria-hidden="true"></svg>
            <div class="chart-card-axis">
              <span>60m ago</span><span>30m</span><span>now</span>
            </div>
          </div>

          <div class="ring-card">
            <svg class="severity-ring" id="severityRing" viewBox="0 0 120 120" aria-hidden="true">
              <circle cx="60" cy="60" r="48" class="ring-track" />
              <circle cx="60" cy="60" r="48" class="ring-seg ring-high" id="ringHigh" />
              <circle cx="60" cy="60" r="48" class="ring-seg ring-medium" id="ringMedium" />
              <circle cx="60" cy="60" r="48" class="ring-seg ring-low" id="ringLow" />
            </svg>
            <div class="ring-center">
              <div class="ring-total" id="ringTotal">0</div>
              <div class="ring-total-sub">active fires</div>
            </div>
            <ul class="ring-legend" id="ringLegend">
              <li><span class="dot sev-high"></span>High <strong id="legendHigh">0</strong></li>
              <li><span class="dot sev-medium"></span>Medium <strong id="legendMedium">0</strong></li>
              <li><span class="dot sev-low"></span>Low <strong id="legendLow">0</strong></li>
            </ul>
          </div>
        </div>
      </div>
    </section>

    <section class="fires-section">
      <div class="fires-inner">
        <div class="section-head">
          <h3>Active fires</h3>
          <span class="section-sub" id="windowLabel">Last 15 minutes</span>
        </div>
        <div id="fires" class="fires-list" role="list"></div>
      </div>
    </section>

    <script type="module" src="splash.js" defer></script>
  </body>
</html>
